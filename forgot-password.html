<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketing.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="mk-auth">
    <div class="mk-auth-visual" style="background-image:url('assets/images/support-laptop.jpg')">
      <div class="mk-auth-float mk-auth-float--tr">
        <div class="mk-f-icon mk-f-icon--blue"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></div>
        <div><b>Reset link sent</b><span>Secure &amp; instant</span></div>
      </div>
      <span class="mk-overline">Account access</span>
      <h2 class="mk-h2">We'll get you back in.</h2>
      <p class="mk-lead">Enter your email and we'll send you a secure link to reset your password.</p>
    </div>
    <div class="mk-auth-panel">
      <div class="mk-auth-card">
        <div class="mk-auth-brand">
          <img src="assets/logos/logo.svg" alt="NationalRegionB"><span class="brand-text">NationalRegion<span>B</span></span>
        </div>
        <h1>Reset your password</h1>
        <p class="mk-auth-sub">Enter your email and we'll send you a secure reset link</p>
        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input type="email" class="input" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-error" id="forgot-error"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="forgot-btn" style="border-radius:14px;font-weight:700">Send Reset Link</button>
        </form>
        <p class="auth-alt">Remembered your password? <a href="login.html">Back to login</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const errEl = document.getElementById('forgot-error');
      errEl.textContent = '';
      const btn = document.getElementById('forgot-btn');
      const email = document.getElementById('email').value.trim();
      if (!email) { errEl.textContent = 'Please enter your email address.'; return; }
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await Auth.resetPassword(email);
        UI.toast('If that email is registered, a reset link has been sent.', 'success');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        document.getElementById('email').value = '';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        errEl.textContent = UI.apiErrorMessage(err);
      }
    });
  </script>

</body>
</html>
