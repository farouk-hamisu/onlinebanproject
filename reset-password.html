<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketing.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="mk-auth">
    <div class="mk-auth-visual" style="background-image:url('assets/images/cyber.jpg')">
      <div class="mk-auth-float mk-auth-float--tr">
        <div class="mk-f-icon mk-f-icon--green"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div>
        <div><b>Password strong</b><span>8+ characters</span></div>
      </div>
      <span class="mk-overline">Secure your account</span>
      <h2 class="mk-h2">Choose a strong password.</h2>
      <p class="mk-lead">Protect your money with a password that only you know.</p>
    </div>
    <div class="mk-auth-panel">
      <div class="mk-auth-card">
        <div class="mk-auth-brand">
          <img src="assets/logos/logo.svg" alt="NationalRegionB">
        </div>
        <h1>Set a new password</h1>
        <p class="mk-auth-sub">Choose a strong password for your account</p>
        <form id="reset-form" novalidate>
          <div class="field">
            <label for="password">New password</label>
            <div class="password-wrap">
              <input type="password" class="input" id="password" placeholder="Min. 8 characters" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" data-target="password">👁</button>
            </div>
          </div>
          <div class="field">
            <label for="confirm">Confirm new password</label>
            <div class="password-wrap">
              <input type="password" class="input" id="confirm" placeholder="Repeat your password" autocomplete="new-password" required>
              <button type="button" class="toggle-pw" data-target="confirm">👁</button>
            </div>
          </div>
          <div class="form-error" id="reset-error"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="reset-btn" style="border-radius:14px;font-weight:700">Update Password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Must come in via recovery link session
      Auth.init().then(function (user) {
        if (!user) {
          UI.toast('This link is invalid or expired. Please request a new one.', 'warning');
          window.location.href = 'forgot-password.html';
        }
      });

      document.querySelectorAll('.toggle-pw').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const input = document.getElementById(btn.getAttribute('data-target'));
          input.type = input.type === 'password' ? 'text' : 'password';
          btn.textContent = input.type === 'password' ? '👁' : '🙈';
        });
      });

      document.getElementById('reset-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const errEl = document.getElementById('reset-error');
        errEl.textContent = '';
        const btn = document.getElementById('reset-btn');
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
        if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }
        btn.disabled = true;
        btn.textContent = 'Updating...';
        try {
          await Auth.updatePassword(password);
          UI.toast('Password updated successfully. Please log in.', 'success');
          await Auth.signOut();
          window.location.href = 'login.html';
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Update Password';
          errEl.textContent = UI.apiErrorMessage(err);
        }
      });
    });
  </script>
</body>
</html>
