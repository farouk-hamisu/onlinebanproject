<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card">
      <div class="filter-bar">
        <div class="flex-between" style="width:100%">
          <h3 class="card-title">Notification Center</h3>
          <div class="flex gap-1">
            <button class="btn btn-outline btn-sm" id="mark-all">Mark all read</button>
          </div>
        </div>
        <select class="select" id="f-type">
          <option value="">All types</option>
          <option value="transfer">Transfers</option>
          <option value="deposit">Deposits</option>
          <option value="loan">Loans</option>
          <option value="card">Cards</option>
          <option value="swap">Currency swaps</option>
          <option value="security">Security</option>
          <option value="account">Account</option>
          <option value="system">System</option>
        </select>
        <select class="select" id="f-read">
          <option value="">All</option>
          <option value="unread">Unread only</option>
          <option value="read">Read only</option>
        </select>
      </div>
      <div id="notif-main-list"><div class="loading-block"><div class="spinner"></div><span>Loading notifications...</span></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
