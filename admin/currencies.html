<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currencies — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-label="Loading">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3" id="user-currency-card">
      <div class="card-header">
        <div>
          <h3 class="card-title">User Currency Management</h3>
          <div class="card-subtitle">Assign or update preferred display currency for individual users (USD, EUR, GBP, NGN, CAD)</div>
        </div>
      </div>

      <div class="filter-bar mb-3" style="flex-wrap:wrap;gap:12px;background:var(--card-subtle,#10192e);padding:14px 16px;border-radius:10px;border:1px solid var(--border)">
        <div style="flex:1 1 280px;min-width:220px">
          <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600">Select Customer</label>
          <select class="select w-100" id="uc-user-select">
            <option value="">Choose a customer...</option>
          </select>
        </div>
        <div style="flex:1 1 240px;min-width:200px">
          <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600">Assign Preferred Currency</label>
          <select class="select w-100" id="uc-currency-select">
            <option value="USD">USD — US Dollar ($) [Platform Default]</option>
            <option value="EUR">EUR — Euro (€)</option>
            <option value="GBP">GBP — British Pound (£)</option>
            <option value="NGN">NGN — Nigerian Naira (₦)</option>
            <option value="CAD">CAD — Canadian Dollar (C$)</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-primary" id="btn-assign-currency" type="button" style="white-space:nowrap">Assign Currency</button>
        </div>
      </div>

      <div class="filter-bar mb-2">
        <div class="grow"><input type="search" class="input" id="uc-search" placeholder="Search customer by name or email..."></div>
        <select class="select" id="uc-filter-currency">
          <option value="">All currencies</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="NGN">NGN (₦)</option>
          <option value="CAD">CAD (C$)</option>
        </select>
      </div>

      <div class="table-wrap">
        <div id="user-currencies-table">
          <div class="loading-block"><div class="spinner"></div><span>Loading user currencies...</span></div>
        </div>
      </div>
      <div class="pagination" id="uc-pagination"></div>
    </div>

    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Currencies</h3><div class="card-subtitle">Manage supported currencies</div></div>
        <button class="btn btn-primary btn-sm" id="btn-add-cur">+ Add Currency</button></div>
      <div class="table-wrap"><div id="currencies-table"><div class="loading-block"><div class="spinner"></div><span>Loading currencies...</span></div></div></div>
    </div>
    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Exchange rates</h3><div class="card-subtitle">Rates and fees used by the currency swap engine</div></div></div>
      <div class="table-wrap"><div id="rates-table"><div class="loading-block"><div class="spinner"></div><span>Loading rates...</span></div></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/currencies.js"></script>

</body>
</html>
