<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Audit Logs</h3><div class="card-subtitle">Every administrative action, immutable and searchable</div></div></div>
      <div class="filter-bar">
        <div class="grow"><input type="search" class="input" id="f-search" placeholder="Search action, resource, admin..."></div>
      </div>
      <div class="table-wrap"><div id="audit-table"><div class="loading-block"><div class="spinner"></div><span>Loading audit logs...</span></div></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/audit-logs.js"></script>
</body>
</html>
