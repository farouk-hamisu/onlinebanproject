<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Swap — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title mb-2">Swap currencies</h3>
        <div class="field"><label>Source currency</label>
          <select class="select" id="s-from"></select>
        </div>
        <div class="field"><label>Destination currency</label>
          <select class="select" id="s-to"></select>
        </div>
        <div class="field"><label>Amount to convert</label>
          <div class="amount-field"><input type="number" class="input" id="s-amount" min="0.01" step="0.01" placeholder="0.00"><span class="currency-tag" id="s-tag">$</span></div>
        </div>
        <div class="review-panel">
          <div class="flex-between"><span class="text-muted">Exchange rate</span><strong id="s-rate">—</strong></div>
          <div class="flex-between"><span class="text-muted">Fee</span><strong id="s-fee">—</strong></div>
          <div class="flex-between"><span class="text-muted">Total to debit</span><strong id="s-debit">—</strong></div>
          <div class="flex-between"><span class="text-muted">Available (source)</span><strong id="s-available">—</strong></div>
          <div class="flex-between"><span class="text-muted">Destination</span><strong id="s-dest">—</strong></div>
          <div class="review-total"><span>You will receive</span><strong id="s-result">—</strong></div>
        </div>
        <div class="form-error" id="s-error"></div>
        <button class="btn btn-primary btn-block" id="s-submit">Review Swap</button>
      </div>
      <div class="card">
        <div class="card-header"><div><h3 class="card-title">Swap history</h3><div class="card-subtitle">Completed and pending swaps</div></div></div>
        <div id="swap-history"><div class="loading-block"><div class="spinner"></div><span>Loading swaps...</span></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/currency-swap.js"></script>
</body>
</html>
