<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Administrators</h3><div class="card-subtitle">Manage staff access to the admin portal</div></div>
        <button class="btn btn-primary btn-sm" id="btn-add-admin">+ Add Admin</button></div>
      <div class="table-wrap"><div id="admins-table"><div class="loading-block"><div class="spinner"></div><span>Loading administrators...</span></div></div></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h3 class="card-title">System settings</h3><div class="card-subtitle">Global platform configuration</div></div></div>
      <div id="settings-form" class="settings-form"><div class="loading-block"><div class="spinner"></div><span>Loading settings...</span></div></div>
      <div class="form-error" id="settings-error"></div>
      <div class="mt-3"><button class="btn btn-primary" id="btn-save-settings">Save Settings</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/settings.js"></script>
</body>
</html>
