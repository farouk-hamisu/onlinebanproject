<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Loan Products</h3><div class="card-subtitle">Products customers can apply for</div></div>
        <button class="btn btn-primary btn-sm" id="btn-add-product">+ Add Product</button></div>
      <div class="table-wrap"><div id="products-table"><div class="loading-block"><div class="spinner"></div><span>Loading products...</span></div></div></div>
    </div>

    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Applications</h3><div class="card-subtitle">Review, approve, reject or activate loan applications</div></div></div>
      <div class="filter-bar">
        <div class="grow"><input type="search" class="input" id="f-search" placeholder="Search reference, user..."></div>
        <select class="select" id="f-status"><option value="">All statuses</option></select>
      </div>
      <div class="table-wrap"><div id="apps-table"><div class="loading-block"><div class="spinner"></div><span>Loading applications...</span></div></div></div>
      <div class="pagination" id="apps-pagination"></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Repayments</h3><div class="card-subtitle">Scheduled and received repayments</div></div></div>
      <div class="table-wrap"><div id="repays-table"><div class="loading-block"><div class="spinner"></div><span>Loading repayments...</span></div></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/loans.js"></script>
</body>
</html>
