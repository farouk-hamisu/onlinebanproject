<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card">
      <div class="filter-bar">
        <div class="grow"><div class="search-field"><span class="icon">⧉</span><input type="search" class="input" id="f-search" placeholder="Search reference, recipient, sender..."></div></div>
        <select class="select" id="f-type"><option value="">All types</option></select>
        <select class="select" id="f-status"><option value="">All statuses</option></select>
        <input type="date" class="input" id="f-from" title="From date">
        <input type="date" class="input" id="f-to" title="To date">
        <button class="btn btn-outline" id="f-reset">Reset</button>
      </div>
      <div class="table-wrap">
        <div id="tx-table"><div class="loading-block"><div class="spinner"></div><span>Loading transactions...</span></div></div>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
