<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfers — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3 hide" id="outgoing-banner" style="background:var(--warning-soft);border:1px solid var(--warning);color:var(--warning);padding:14px 18px;border-radius:var(--radius,12px);font-size:14px">
      <strong>Outgoing transfers are currently disabled on your account.</strong>
      <div id="outgoing-banner-reason" class="text-muted" style="margin-top:2px"></div>
    </div>

    <div class="card mb-3">
      <div class="flex-between mb-2">
        <h3 class="card-title mb-0">International transfers</h3>
        <a href="international-transfer.html" class="btn btn-outline btn-sm">+ New Transfer</a>
      </div>
      <div class="table-wrap"><div id="intl-table"><div class="loading-block"><div class="spinner"></div><span>Loading transfers...</span></div></div></div>
    </div>

    <div class="card">
      <div class="flex-between mb-2">
        <h3 class="card-title mb-0">Crypto withdrawals</h3>
        <a href="crypto-withdrawal.html" class="btn btn-outline btn-sm">+ New Withdrawal</a>
      </div>
      <div class="table-wrap"><div id="crypto-table"><div class="loading-block"><div class="spinner"></div><span>Loading withdrawals...</span></div></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/transfers.js"></script>
</body>
</html>
