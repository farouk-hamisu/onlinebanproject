<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketing.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <!-- HERO -->
  <section class="mk-section" style="padding-bottom:0">
    <div class="container">
      <div class="mk-head center">
        <span class="mk-overline center">Contact</span>
        <h2 class="mk-h2">We're here to help</h2>
        <p class="mk-lead" style="margin-top:14px">Reach our support team any time — we respond within one business day.</p>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="mk-section">
    <div class="container">
      <div class="mk-contact-grid">
        <div>
          <div class="mk-frame" style="aspect-ratio:4 / 3">
            <img src="assets/images/support-laptop.jpg" alt="NationalRegionB support team" loading="lazy">
          </div>
          <div style="display:grid;gap:14px;margin-top:18px">
            <div class="mk-contact-card">
              <div class="mk-f-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
              <div><b>Call us</b><p>+1 (800) 555-0142</p></div>
            </div>
            <div class="mk-contact-card">
              <div class="mk-f-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/></svg></div>
              <div><b>Email us</b><p>support@nationalregionb.com</p></div>
            </div>
            <div class="mk-contact-card">
              <div class="mk-f-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
              <div><b>Head office</b><p>2210 Market Street, San Francisco, CA 94114</p></div>
            </div>
          </div>
        </div>
        <div class="mk-auth-card" style="max-width:none">
          <div style="background:#fff;border:1px solid var(--mk-line);border-radius:var(--mk-radius);padding:clamp(24px,3vw,34px)">
            <h3 style="font-size:22px;font-weight:800;margin:0 0 20px;letter-spacing:-.01em">Send us a message</h3>
            <div class="field"><label>Name</label><input type="text" class="input" id="c-name" placeholder="Your full name"></div>
            <div class="field"><label>Email</label><input type="email" class="input" id="c-email" placeholder="you@example.com"></div>
            <div class="field"><label>Subject</label><input type="text" class="input" id="c-subject" placeholder="How can we help?"></div>
            <div class="field"><label>Message</label><textarea class="textarea" id="c-message" placeholder="Write your message..."></textarea></div>
            <div class="form-error" id="c-error"></div>
            <button class="btn btn-primary btn-lg btn-block" id="c-submit" style="border-radius:14px;font-weight:700">Send Message</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/site.js"></script>
  <script>
    document.getElementById('c-submit').addEventListener('click', function () {
      const err = document.getElementById('c-error');
      err.textContent = '';
      const name = document.getElementById('c-name').value.trim();
      const email = document.getElementById('c-email').value.trim();
      const subject = document.getElementById('c-subject').value.trim();
      const message = document.getElementById('c-message').value.trim();
      if (!name || !email || !message) { err.textContent = 'Please fill in your name, email and message.'; return; }
      UI.toast('Thank you! Your message has been received. Our team will respond shortly.', 'success');
      ['c-name', 'c-email', 'c-subject', 'c-message'].forEach(function (id) { document.getElementById(id).value = ''; });
    });
  </script>
</body>
</html>
