<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loans — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div id="eligibility" class="card mb-3"><div class="loading-block"><div class="spinner"></div><span>Checking eligibility...</span></div></div>

    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Loan products</h3><div class="card-subtitle">Available loan products from NationalRegionB</div></div></div>
      <div id="products" class="grid-auto"><div class="loading-block"><div class="spinner"></div><span>Loading loan products...</span></div></div>
    </div>

    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">My applications</h3><div class="card-subtitle">Track your loan application status</div></div></div>
      <div id="applications"><div class="loading-block"><div class="spinner"></div><span>Loading applications...</span></div></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Active loans & repayments</h3><div class="card-subtitle">Repayment schedule and history</div></div></div>
      <div id="active-loans"><div class="loading-block"><div class="spinner"></div><span>Loading loans...</span></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/loans.js"></script>
</body>
</html>
