<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card mb-3">
      <div class="card-header"><div><h3 class="card-title">Send a notification</h3><div class="card-subtitle">Target a single customer or broadcast to everyone</div></div></div>
      <div class="field">
        <label>Recipient</label>
        <select class="select" id="n-scope"><option value="user">A specific customer</option><option value="global">All customers (global)</option></select>
      </div>
      <div class="field" id="n-email-wrap"><label>Customer email</label><input type="email" class="input" id="n-email"></div>
      <div class="field"><label>Type</label>
        <select class="select" id="n-type">
          <option value="system">System</option><option value="transfer">Transfer</option><option value="deposit">Deposit</option>
          <option value="loan">Loan</option><option value="card">Card</option><option value="swap">Currency swap</option><option value="security">Security</option><option value="account">Account</option>
        </select>
      </div>
      <div class="field"><label>Title</label><input type="text" class="input" id="n-title"></div>
      <div class="field"><label>Message</label><textarea class="input" id="n-message" rows="3"></textarea></div>
      <div class="form-error" id="n-error"></div>
      <div><button class="btn btn-primary" id="btn-send">Send Notification</button></div>
    </div>

    <div class="card">
      <div class="card-header"><div><h3 class="card-title">Sent notifications</h3><div class="card-subtitle">All customer notifications</div></div></div>
      <div class="table-wrap"><div id="notifs-table"><div class="loading-block"><div class="spinner"></div><span>Loading notifications...</span></div></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/notifications.js"></script>
</body>
</html>
