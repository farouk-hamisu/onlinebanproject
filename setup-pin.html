<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security PIN — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/marketing.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>
  <div class="mk-auth">
    <div class="mk-auth-visual" style="background-image:url('assets/images/phone-hand.jpg')">
      <div class="mk-auth-float mk-auth-float--tr">
        <div class="mk-f-icon mk-f-icon--blue"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div><b>PIN protected</b><span>Added layer of security</span></div>
      </div>
      <div class="mk-auth-float mk-auth-float--bl">
        <div class="mk-f-icon mk-f-icon--green"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div><b>Private by default</b><span>Verified on every request</span></div>
      </div>
      <span class="mk-overline">Account security</span>
      <h2 class="mk-h2">One more step.</h2>
      <p class="mk-lead">Set a 4-digit security PIN. It protects your account and authorizes every transfer, swap and sensitive action.</p>
    </div>
    <div class="mk-auth-panel">
      <div class="mk-auth-card">
        <div class="mk-auth-brand">
          <img src="assets/logos/logo.svg" alt="NationalRegionB">
        </div>
        <h1 id="sp-title">Set up your security PIN</h1>
        <p class="mk-auth-sub" id="sp-sub">Choose a 4-digit PIN you'll remember</p>
        <form id="pin-form" novalidate>
          <div class="field" id="current-field" style="display:none">
            <label>Current PIN</label>
            <div id="pin-current"></div>
            <div class="form-error" id="pin-current-error"></div>
          </div>
          <div class="field">
            <label id="new-label">New PIN</label>
            <div id="pin-new"></div>
            <div class="form-error" id="pin-new-error"></div>
          </div>
          <div class="field">
            <label>Confirm PIN</label>
            <div id="pin-confirm"></div>
            <div class="form-error" id="pin-confirm-error"></div>
          </div>
          <div class="form-error" id="sp-error"></div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="sp-btn" style="border-radius:14px;font-weight:700">Save PIN</button>
          <button type="button" class="btn btn-outline btn-lg btn-block" id="sp-back" style="border-radius:14px;font-weight:600;margin-top:8px">Back to dashboard</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/setup-pin.js"></script>
</body>
</html>
