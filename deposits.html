<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposits — NationalRegionB</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="grid-2">
      <div class="card">
        <h3 class="card-title mb-2">Make a deposit</h3>
        <div class="field"><label>Deposit to account</label><select class="select" id="d-account"></select></div>
        <div class="field"><label>Method</label>
          <select class="select" id="d-method">
            <option value="bank_transfer">Bank Transfer</option>
            <option value="cash">Cash</option>
            <option value="cheque">Cheque</option>
            <option value="card">Card</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div class="field"><label>Amount</label>
          <div class="amount-field"><input type="number" class="input" id="d-amount" min="0.01" step="0.01" placeholder="0.00"><span class="currency-tag" id="d-currency-tag">$</span></div>
        </div>
        <div class="field"><label>Note <span class="text-muted">(optional)</span></label><input type="text" class="input" id="d-note" placeholder="e.g. Salary deposit"></div>
        <div class="form-error" id="d-error"></div>
        <button class="btn btn-primary btn-block" id="d-submit">Submit Deposit</button>
        <div class="demo-credentials mt-3">
          <strong>Deposit instructions</strong><br>
          After submission your deposit is reviewed and approved by an administrator. Approved deposits are credited to your account automatically.
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div><h3 class="card-title">Deposit history</h3><div class="card-subtitle">Track the status of your deposits</div></div></div>
        <div id="deposit-history"><div class="loading-block"><div class="spinner"></div><span>Loading deposits...</span></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/deposits.js"></script>
</body>
</html>
