<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts — NationalRegionB Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tables.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="card">
      <div class="filter-bar">
        <div class="grow"><input type="search" class="input" id="f-search" placeholder="Search account number, owner..."></div>
        <select class="select" id="f-status"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="suspended">Suspended</option><option value="closed">Closed</option></select>
        <select class="select" id="f-currency"><option value="">All currencies</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="NGN">NGN</option><option value="CAD">CAD</option></select>
        <button class="btn btn-primary" id="btn-create">+ Create Account</button>
      </div>
      <div class="table-wrap"><div id="accounts-table"><div class="loading-block"><div class="spinner"></div><span>Loading accounts...</span></div></div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/admin/auth.js"></script>
  <script src="../js/admin/accounts.js"></script>
</body>
</html>
